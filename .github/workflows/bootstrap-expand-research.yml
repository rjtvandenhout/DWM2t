name: Expand research bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/research.tar.xz.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify research archive
        shell: bash
        run: |
          base64 -d bootstrap/research.tar.xz.b64 > /tmp/DWM2t_research.tar.xz
          echo 'e8a3d85aaf047d7395404f07ace16c5b6dda1d4e4c88bb96bd268252cdda276f  /tmp/DWM2t_research.tar.xz' | sha256sum -c -
          tar -xJf /tmp/DWM2t_research.tar.xz
      - name: Commit research tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm bootstrap/research.tar.xz.b64
          git add research
          git commit -m 'Add complete DWM2 reverse-engineering research data'
          git push
