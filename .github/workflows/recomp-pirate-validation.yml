name: Original story validation on pinned Windows build

on:
  push:
    branches: ['work/recomp-m8-pirate-validation-20261022']
  workflow_dispatch:
    inputs:
      prefix_run_id:
        description: Optional passed Windows story run to audit and continue from
        required: false
        default: ''
        type: string
      prefix_stage:
        description: Exact last Journal in that passed prefix
        required: false
        default: helen-restored
        type: string

permissions:
  contents: read
  actions: read

jobs:
  sea-world:
    if: ${{ inputs.prefix_run_id == '' }}
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the exact successful 255-bank native Windows build
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39836316030
          name: DWM2t-M8-development-Windows-x64-697647033b4ce6b00dd8e11759cb85e1ae469a65
          path: ${{ runner.temp }}/native-player
      - name: Download its original validated Kids Class Journal
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39836316030
          name: DWM2t-M8-development-evidence-39836316030-1
          path: ${{ runner.temp }}/baseline-evidence
      - name: Verify binary identity and replay original Sea World progression
        shell: pwsh
        run: |
          python recomp/tools/test_m8_pirate_pinned.py `
            --exe "$env:RUNNER_TEMP/native-player/DWM2tRecompFull.exe" `
            --evidence "$env:RUNNER_TEMP/baseline-evidence" `
            --route recomp/tests/m8_pirate_battle_p1.txt `
            --output "$env:RUNNER_TEMP/pirate-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Continue the original route through village inn and a later Journal
        shell: pwsh
        run: |
          python recomp/tools/test_m8_pirate_village.py `
            --exe "$env:RUNNER_TEMP/native-player/DWM2tRecompFull.exe" `
            --seed "$env:RUNNER_TEMP/pirate-evidence/native/checkpoint.sav" `
            --route recomp/tests/m8_pirate_village_p1.txt `
            --output "$env:RUNNER_TEMP/village-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify original farm dancer pickup and fresh Continue
        shell: pwsh
        run: |
          python recomp/tools/test_m8_farm_dancer.py `
            --exe "$env:RUNNER_TEMP/native-player/DWM2tRecompFull.exe" `
            --seed "$env:RUNNER_TEMP/village-evidence/native/checkpoint.sav" `
            --route recomp/tests/m8_farm_dancer_p1.txt `
            --ready-route recomp/tests/m8_farm_dancer_ready_p1.txt `
            --village-route recomp/tests/m8_sea_dancer_alive_p1.txt `
            --output "$env:RUNNER_TEMP/farm-dancer-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify original support party, trading and GreatLog-key training
        shell: pwsh
        run: |
          python recomp/tools/test_m8_party_preparation.py `
            --exe "$env:RUNNER_TEMP/native-player/DWM2tRecompFull.exe" `
            --seed "$env:RUNNER_TEMP/farm-dancer-evidence/village/native/checkpoint.sav" `
            --support-route recomp/tests/m8_farm_support_p1.txt `
            --training-route recomp/tests/m8_gate_training_p1.txt `
            --output "$env:RUNNER_TEMP/party-preparation-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify original story Journals, breeding and later Continue
        shell: pwsh
        run: |
          python recomp/tools/test_m8_story_checkpoints.py `
            --exe "$env:RUNNER_TEMP/native-player/DWM2tRecompFull.exe" `
            --seed "$env:RUNNER_TEMP/party-preparation-evidence/training/native/checkpoint.sav" `
            --manifest recomp/tests/m8_sea_story_checkpoints.json `
            --output "$env:RUNNER_TEMP/sea-story-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve original Sea World story and fresh-Continue evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DWM2t-Sea-Story-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sea-story-evidence/**
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve original entry battle, save and fresh-Continue evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DWM2t-Sea-World-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pirate-evidence/**
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve village, farm and later Journal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DWM2t-Sea-Village-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/village-evidence/**
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve farm dancer exchange and original Journal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DWM2t-Farm-Dancer-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/farm-dancer-evidence/**
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve support party and training Journal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DWM2t-Party-Preparation-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/party-preparation-evidence/**
          if-no-files-found: warn
          retention-days: 30

  later-story:
    if: ${{ inputs.prefix_run_id != '' }}
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse the pinned complete-AOT diagnostic executable
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39836316030
          name: DWM2t-M8-development-Windows-x64-697647033b4ce6b00dd8e11759cb85e1ae469a65
          path: ${{ runner.temp }}/native-player
      - name: Download the passed native prefix and original boundary Journal
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.prefix_run_id }}
          name: DWM2t-Sea-Story-native-evidence-${{ inputs.prefix_run_id }}-1
          path: ${{ runner.temp }}/passed-prefix
      - name: Audit every archived prefix checkpoint and replay the later story
        shell: pwsh
        env:
          PREFIX_RUN: ${{ inputs.prefix_run_id }}
          PREFIX_STAGE: ${{ inputs.prefix_stage }}
        run: |
          python recomp/tools/test_m8_story_suffix.py `
            --exe "$env:RUNNER_TEMP/native-player/DWM2tRecompFull.exe" `
            --prefix-evidence "$env:RUNNER_TEMP/passed-prefix" `
            --prefix-run-id "$env:PREFIX_RUN" --prefix-stage "$env:PREFIX_STAGE" `
            --manifest recomp/tests/m8_sea_story_checkpoints.json `
            --output "$env:RUNNER_TEMP/later-story-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve the new native Journals and explicit prefix audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DWM2t-Sea-Story-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/later-story-evidence/**
          if-no-files-found: warn
          retention-days: 30
