name: Verify matching decompilation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Rebuild from assembly source
        run: python tools/rebuild.py --out build/dwm2_cobi.gbc
      - name: Verify exact ROM hashes
        run: python tools/verify.py build/dwm2_cobi.gbc

  rgbds-recompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build and install RGBDS
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config bison flex libpng-dev
          git clone --depth 1 https://github.com/gbdev/rgbds.git /tmp/rgbds
          make -C /tmp/rgbds -j2
          sudo make -C /tmp/rgbds install
          rgbasm --version
      - name: Assemble, link and verify byte-identical ROM
        run: make rgbds
