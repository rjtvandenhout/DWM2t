name: Verify matching ROM

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Rebuild byte-exact ROM
        run: python tools/rebuild.py --out build/dwm2_cobi.gbc
      - name: Verify known hashes
        run: python tools/verify.py build/dwm2_cobi.gbc
