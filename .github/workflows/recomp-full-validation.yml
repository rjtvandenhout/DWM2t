name: Fresh M8 builds and campaign validation

on:
  workflow_call:
    inputs:
      story_journals_base64:
        type: string
        required: false
        default: ''
      postgame_journals_base64:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      story_journals_base64:
        description: Optional base64 tar.xz of pinned original Journals for parallel campaign replay
        type: string
        required: false
        default: ''
      postgame_journals_base64:
        description: Optional base64 tar.xz of pinned original postgame Journals for parallel replay
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode optional pinned original Journal inputs without shell interpolation
        uses: actions/github-script@v7
        with:
          script: |
            for (const [input, filename] of [
              ['story_journals_base64', 'story-seed-journals.tar.xz'],
              ['postgame_journals_base64', 'postgame-seed-journals.tar.xz']
            ]) {
              const encoded = context.payload.inputs?.[input] ?? '';
              if (typeof encoded !== 'string') {
                throw new Error('The original Journal bundle input must be a base64 string.');
              }
              if (encoded === '') {
                core.info(`No ${input} supplied; retaining serial replay.`);
                continue;
              }
              core.setSecret(encoded);
              if (encoded.length > 65535 || encoded.length % 4 !== 0 || !/^[A-Za-z0-9+/]*={0,2}$/.test(encoded)) {
                throw new Error('The original Journal bundle input is not canonical base64.');
              }
              const decoded = Buffer.from(encoded, 'base64');
              if (decoded.toString('base64') !== encoded) {
                throw new Error('The original Journal bundle input is not canonical base64.');
              }
              const path = require('path').join(process.env.RUNNER_TEMP, filename);
              require('fs').writeFileSync(path, decoded, {flag: 'wx', mode: 0o600});
              core.info(`${input} decoded for hash-validated parallel replay.`);
            }
      - name: Check host-side validation contracts
        shell: pwsh
        run: |
          python recomp/tools/test_m8_build_identity.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python recomp/tools/test_m8_handoff.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python recomp/tools/test_m8_package.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python recomp/tools/test_m8_story_parallel_contracts.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build fresh complete-AOT diagnostic from an isolated source archive
        shell: pwsh
        run: |
          python recomp/tools/build_m8_diagnostic.py --jobs 2 `
            --workspace "$env:RUNNER_TEMP/diagnostic-work" --output "$env:RUNNER_TEMP/diagnostic-output"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Provide a signed native Windows audio endpoint for the original output gates
        shell: pwsh
        run: |
          & recomp/tools/setup_windows_ci_audio.ps1 -Output "$env:RUNNER_TEMP/diagnostic-audio"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the retained M1-M8 development suite
        shell: pwsh
        run: |
          ctest --test-dir "$env:RUNNER_TEMP/diagnostic-work/native" -C Release `
            --parallel 4 --output-on-failure --output-junit native-results.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay original Sea entry from the newly generated Kids Class Journal
        shell: pwsh
        run: |
          python recomp/tools/test_m8_pirate_pinned.py `
            --exe "$env:RUNNER_TEMP/diagnostic-output/DWM2tRecompFull.exe" `
            --build-identity "$env:RUNNER_TEMP/diagnostic-output/build-identity.json" `
            --evidence "$env:RUNNER_TEMP/diagnostic-work/native" `
            --route recomp/tests/m8_pirate_battle_p1.txt --output "$env:RUNNER_TEMP/pirate-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python recomp/tools/test_m8_pirate_village.py `
            --exe "$env:RUNNER_TEMP/diagnostic-output/DWM2tRecompFull.exe" `
            --build-identity "$env:RUNNER_TEMP/diagnostic-output/build-identity.json" `
            --seed "$env:RUNNER_TEMP/pirate-evidence/native/checkpoint.sav" `
            --route recomp/tests/m8_pirate_village_p1.txt --output "$env:RUNNER_TEMP/village-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay original farm exchange, support party and key training
        shell: pwsh
        run: |
          python recomp/tools/test_m8_farm_dancer.py `
            --exe "$env:RUNNER_TEMP/diagnostic-output/DWM2tRecompFull.exe" `
            --build-identity "$env:RUNNER_TEMP/diagnostic-output/build-identity.json" `
            --seed "$env:RUNNER_TEMP/village-evidence/native/checkpoint.sav" `
            --route recomp/tests/m8_farm_dancer_p1.txt --ready-route recomp/tests/m8_farm_dancer_ready_p1.txt `
            --village-route recomp/tests/m8_sea_dancer_alive_p1.txt --output "$env:RUNNER_TEMP/farm-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python recomp/tools/test_m8_party_preparation.py `
            --exe "$env:RUNNER_TEMP/diagnostic-output/DWM2tRecompFull.exe" `
            --build-identity "$env:RUNNER_TEMP/diagnostic-output/build-identity.json" `
            --seed "$env:RUNNER_TEMP/farm-evidence/village/native/checkpoint.sav" `
            --support-route recomp/tests/m8_farm_support_p1.txt --training-route recomp/tests/m8_gate_training_p1.txt `
            --output "$env:RUNNER_TEMP/preparation-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay every retained later story checkpoint on this fresh build
        shell: pwsh
        run: |
          $storyArguments = @(
            'recomp/tools/test_m8_story_checkpoints.py',
            '--exe', "$env:RUNNER_TEMP/diagnostic-output/DWM2tRecompFull.exe",
            '--build-identity', "$env:RUNNER_TEMP/diagnostic-output/build-identity.json",
            '--seed', "$env:RUNNER_TEMP/preparation-evidence/training/native/checkpoint.sav",
            '--manifest', 'recomp/tests/m8_sea_story_checkpoints.json',
            '--output', "$env:RUNNER_TEMP/story-evidence"
          )
          $storySeedBundle = Join-Path $env:RUNNER_TEMP 'story-seed-journals.tar.xz'
          if (Test-Path -LiteralPath $storySeedBundle -PathType Leaf) {
            $storyArguments += @('--workers', '4', '--seed-bundle', $storySeedBundle)
          }
          python @storyArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve original story Journals and fresh Continue captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M8-fresh-story-${{ github.run_id }}
          path: ${{ runner.temp }}/story-evidence/**
          if-no-files-found: warn
          retention-days: 30
      - name: Replay all seven retained original postgame checkpoints on this fresh build
        shell: pwsh
        run: |
          $postgameArguments = @(
            'recomp/tools/test_postgame_supplemental.py', '--fresh-build',
            '--exe', "$env:RUNNER_TEMP/diagnostic-output/DWM2tRecompFull.exe",
            '--build-identity', "$env:RUNNER_TEMP/diagnostic-output/build-identity.json",
            '--seed', "$env:RUNNER_TEMP/story-evidence/ending-complete/native/checkpoint.sav",
            '--manifest', 'recomp/tests/m8_postgame_supplemental.json',
            '--output', "$env:RUNNER_TEMP/postgame-evidence"
          )
          $postgameSeedBundle = Join-Path $env:RUNNER_TEMP 'postgame-seed-journals.tar.xz'
          if (Test-Path -LiteralPath $postgameSeedBundle -PathType Leaf) {
            $postgameArguments += @('--workers', '4', '--seed-bundle', $postgameSeedBundle)
          }
          python @postgameArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve postgame replay and original Journal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M8-fresh-postgame-${{ github.run_id }}
          path: ${{ runner.temp }}/postgame-evidence/**
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve fresh diagnostic and exact source archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M8-fresh-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/diagnostic-output/**
            ${{ runner.temp }}/diagnostic-work/source.tar
            ${{ runner.temp }}/story-seed-journals.tar.xz
            ${{ runner.temp }}/postgame-seed-journals.tar.xz
            ${{ runner.temp }}/diagnostic-work/native/native-results.xml
            ${{ runner.temp }}/diagnostic-work/native/CTestTestfile.cmake
            ${{ runner.temp }}/diagnostic-work/native/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/diagnostic-work/native/local-validation/**
            ${{ runner.temp }}/pirate-evidence/**
            ${{ runner.temp }}/village-evidence/**
            ${{ runner.temp }}/farm-evidence/**
            ${{ runner.temp }}/preparation-evidence/**
            ${{ runner.temp }}/diagnostic-audio/**
          if-no-files-found: warn
          retention-days: 30

  production:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run actual Windows filesystem persistence contracts
        shell: pwsh
        run: |
          cmake -S recomp/tests/save-io -B "$env:RUNNER_TEMP/save-io" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/save-io" --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir "$env:RUNNER_TEMP/save-io" -C Release --output-on-failure --output-junit save-io.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Independently build the production package from the same exact commit
        shell: pwsh
        run: |
          python recomp/tools/build_m8_candidate.py --jobs 2 `
            --workspace "$env:RUNNER_TEMP/production-work" --output "$env:RUNNER_TEMP/production-output"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate the full hardware core independently from the original campaign
        shell: pwsh
        run: |
          python recomp/tools/validate_runtime_core.py --source '${{ github.sha }}' `
            --output "$env:RUNNER_TEMP/runtime-core-windows"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check the copied production EXE with direct and named-profile startup
        shell: pwsh
        run: |
          python recomp/tools/test_player_startup.py --no-arguments `
            --exe "$env:RUNNER_TEMP/production-output/DWM2t-M8-UNTESTED/DWM2tRecomp.exe" `
            --output "$env:RUNNER_TEMP/direct-start" --source '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python recomp/tools/test_player_startup.py `
            --exe "$env:RUNNER_TEMP/production-output/DWM2t-M8-UNTESTED/DWM2tRecomp.exe" `
            --output "$env:RUNNER_TEMP/profile-start" --source '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve the production package and exact source archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M8-fresh-production-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/production-output/*.zip
            ${{ runner.temp }}/production-output/build-report.json
            ${{ runner.temp }}/production-output/build-logs/**
            ${{ runner.temp }}/production-work/source.tar
            ${{ runner.temp }}/save-io/save-io.xml
            ${{ runner.temp }}/save-io/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/direct-start/**
            ${{ runner.temp }}/profile-start/**
            ${{ runner.temp }}/runtime-core-windows/**
          if-no-files-found: warn
          retention-days: 30

  production-journal:
    needs: [diagnostic, production]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: M8-fresh-production-${{ github.run_id }}
          path: ${{ runner.temp }}/production
      - uses: actions/download-artifact@v4
        with:
          name: M8-fresh-story-${{ github.run_id }}
          path: ${{ runner.temp }}/story
      - name: Validate the actual archived package and derive its GUI spec
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/production/production-output" -Filter '*.zip')
          if ($archive.Count -ne 1) { throw 'Expected exactly one fresh package archive' }
          Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath "$env:RUNNER_TEMP/package with spaces-é"
          python recomp/tools/prepare_m8_player_validation.py `
            --package "$env:RUNNER_TEMP/package with spaces-é/DWM2t-M8-UNTESTED" --source '${{ github.sha }}' `
            --reference recomp/tests/m8_player_late_journal.json --output "$env:RUNNER_TEMP/fresh-gui-spec.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python recomp/tools/prepare_m8_player_validation.py `
            --package "$env:RUNNER_TEMP/package with spaces-é/DWM2t-M8-UNTESTED" --source '${{ github.sha }}' `
            --reference recomp/tests/m8_player_ending_journal.json --output "$env:RUNNER_TEMP/fresh-ending-gui-spec.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate two real production windows, input isolation and save locks
        shell: pwsh
        run: |
          python recomp/tools/test_player_local_link.py `
            --exe "$env:RUNNER_TEMP/package with spaces-é/DWM2t-M8-UNTESTED/DWM2tRecomp.exe" `
            --source '${{ github.sha }}' `
            --seed "$env:RUNNER_TEMP/story/ending-complete/native/checkpoint.sav" `
            --output "$env:RUNNER_TEMP/production-local-link"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test original later Journal Save and fresh production-process Continue
        shell: pwsh
        run: |
          python recomp/tools/test_player_package.py `
            --package "$env:RUNNER_TEMP/package with spaces-é/DWM2t-M8-UNTESTED" --source '${{ github.sha }}' `
            --seed "$env:RUNNER_TEMP/story/raygigas-birth/native/checkpoint.sav" `
            --output "$env:RUNNER_TEMP/player-package"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python recomp/tools/test_player_late_journal.py `
            --exe "$env:RUNNER_TEMP/package with spaces-é/DWM2t-M8-UNTESTED/DWM2tRecomp.exe" `
            --seed "$env:RUNNER_TEMP/story/raygigas-birth/native/checkpoint.sav" `
            --manifest "$env:RUNNER_TEMP/fresh-gui-spec.json" --output "$env:RUNNER_TEMP/production-journal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python recomp/tools/test_player_late_journal.py `
            --exe "$env:RUNNER_TEMP/package with spaces-é/DWM2t-M8-UNTESTED/DWM2tRecomp.exe" `
            --seed "$env:RUNNER_TEMP/story/ending-complete/native/checkpoint.sav" `
            --manifest "$env:RUNNER_TEMP/fresh-ending-gui-spec.json" --output "$env:RUNNER_TEMP/production-ending-journal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve production GUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M8-fresh-production-journal-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/production-journal/**
            ${{ runner.temp }}/production-ending-journal/**
            ${{ runner.temp }}/production-local-link/**
            ${{ runner.temp }}/player-package/**
            ${{ runner.temp }}/fresh-gui-spec.json
            ${{ runner.temp }}/fresh-ending-gui-spec.json
          if-no-files-found: warn
          retention-days: 30

  verified-package:
    needs: [diagnostic, production, production-journal, posix-persistence]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: M8-fresh-*-${{ github.run_id }}
          path: ${{ runner.temp }}/proof
      - name: Bind the unchanged tested player to all passing exact-source evidence
        shell: pwsh
        run: |
          python recomp/tools/package_verified_m8.py --root "$env:RUNNER_TEMP/proof" `
            --source '${{ github.sha }}' --run-id '${{ github.run_id }}' --output "$env:RUNNER_TEMP/verified-output"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python recomp/tools/prepare_m8_player_validation.py `
            --package "$env:RUNNER_TEMP/verified-output/DWM2t-M8" --source '${{ github.sha }}' `
            --reference recomp/tests/m8_player_ending_journal.json --output "$env:RUNNER_TEMP/verified-ending-spec.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test the final Play.cmd and original ending Journal on the verified package
        shell: pwsh
        run: |
          python recomp/tools/test_player_package.py --via-cmd `
            --package "$env:RUNNER_TEMP/verified-output/DWM2t-M8" --source '${{ github.sha }}' `
            --seed "$env:RUNNER_TEMP/proof/M8-fresh-story-${{ github.run_id }}/raygigas-birth/native/checkpoint.sav" `
            --output "$env:RUNNER_TEMP/verified-package-checks"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python recomp/tools/test_player_late_journal.py `
            --exe "$env:RUNNER_TEMP/verified-output/DWM2t-M8/DWM2tRecomp.exe" `
            --seed "$env:RUNNER_TEMP/proof/M8-fresh-story-${{ github.run_id }}/ending-complete/native/checkpoint.sav" `
            --manifest "$env:RUNNER_TEMP/verified-ending-spec.json" --output "$env:RUNNER_TEMP/verified-ending-journal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve post-packaging evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M8-final-package-checks-${{ github.sha }}
          path: |
            ${{ runner.temp }}/verified-package-checks/**
            ${{ runner.temp }}/verified-ending-journal/**
            ${{ runner.temp }}/verified-ending-spec.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish the verified package only after its final checks pass
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DWM2t-M8-VERIFIED-${{ github.sha }}
          path: |
            ${{ runner.temp }}/verified-output/*.zip
            ${{ runner.temp }}/verified-output/verified-package.json
          if-no-files-found: error
          retention-days: 30

  posix-persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate the POSIX filesystem helper separately
        run: |
          cmake -S recomp/tests/save-io -B "$RUNNER_TEMP/save-io" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/save-io" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/save-io" --output-on-failure --output-junit save-io.xml
      - name: Validate the hardware core on POSIX from the same source
        run: |
          python3 recomp/tools/validate_runtime_core.py --source '${{ github.sha }}' \
            --output "$RUNNER_TEMP/runtime-core-posix"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M8-fresh-posix-persistence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/save-io/save-io.xml
            ${{ runner.temp }}/save-io/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/runtime-core-posix/**
          retention-days: 30
