name: Native static recomp

concurrency:
  group: native-recomp-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 'recomp/native-pc'
      - 'work/recomp-*'
    paths:
      - 'recomp/**'
      - 'src/banks/**'
      - '.github/workflows/recomp-windows.yml'
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Restore native recomp build cache
        uses: actions/cache/restore@v4
        with:
          path: recomp/build
          key: m6-native-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            m6-native-${{ runner.os }}-

      - name: Validate complete LR35902 frontend
        run: python recomp/tools/test_lr35902.py --bank0 src/banks/bank_000.asm

      - name: Audit complete Bank 0 static translation
        run: python recomp/tools/recompile_bank0.py --bank src/banks/bank_000.asm --audit-only

      - name: Configure native recomp
        run: cmake -S recomp -B recomp/build -A x64

      - name: Build native recomp and required AOT dependencies
        run: cmake --build recomp/build --config Release --target DWM2tRecomp --parallel 4

      - name: Save native recomp build cache
        uses: actions/cache/save@v4
        with:
          path: recomp/build
          key: m6-native-${{ runner.os }}-${{ github.sha }}

      - name: Run M4 renderer regression
        run: .\recomp\build\Release\DWM2tRecomp.exe --self-test --bmp recomp/build/m4_renderer_test.bmp

      - name: Run M5 original title-screen regression
        run: .\recomp\build\Release\DWM2tRecomp.exe --title-test recomp/build/m5_title_screen.bmp

      - name: Run M6 input/flow exploration probe
        run: .\recomp\build\Release\DWM2tRecomp.exe --m6-probe recomp/build/m6_probe

      - name: Run M6 SRAM persistence regression
        run: .\recomp\build\Release\DWM2tRecomp.exe --m6-sram-test recomp/build/m6_test.sav

      - name: Run M6 live Win32 window smoke test
        run: .\recomp\build\Release\DWM2tRecomp.exe --m6-window-smoke recomp/build/m6_test.sav

      - name: Upload Windows executable and milestone images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DWM2tRecomp-M7-Discovery-Windows-x64
          path: |
            recomp/build/Release/DWM2tRecomp.exe
            recomp/build/m4_renderer_test.bmp
            recomp/build/m5_title_screen.bmp
            recomp/build/m6_probe/**
            recomp/build/m6_test.sav
            recomp/build/m7_discovery/**
          if-no-files-found: error
