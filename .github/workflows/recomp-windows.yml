name: Native static recomp

concurrency:
  group: native-recomp-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 'recomp/native-pc'
      - 'work/recomp-*'
    paths:
      - 'recomp/**'
      - 'src/banks/**'
      - '.github/workflows/recomp-windows.yml'
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate complete LR35902 frontend
        run: python recomp/tools/test_lr35902.py --bank0 src/banks/bank_000.asm

      - name: Audit complete Bank 0 static translation
        run: python recomp/tools/recompile_bank0.py --bank src/banks/bank_000.asm --audit-only

      - name: Configure native recomp
        run: cmake -S recomp -B recomp/build -A x64

      - name: Build DWM2tRecomp.exe
        run: cmake --build recomp/build --config Release --parallel 4

      - name: Run M4 regression suite
        run: .\recomp\build\Release\DWM2tRecomp.exe --self-test --bmp recomp/build/m4_renderer_test.bmp

      - name: Probe original DWM2 title boot path
        id: title_probe
        continue-on-error: true
        run: .\recomp\build\Release\DWM2tRecomp.exe --title-probe recomp/build/title_probe

      - name: Upload Windows executable and boot probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DWM2tRecomp-M5-Probe-Windows-x64
          path: |
            recomp/build/Release/DWM2tRecomp.exe
            recomp/build/m4_renderer_test.bmp
            recomp/build/title_probe/*.bmp
          if-no-files-found: warn
