name: Native static recomp

concurrency:
  group: native-recomp-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 'recomp/native-pc'
      - 'work/recomp-*'
    paths:
      - 'recomp/**'
      - 'src/banks/**'
      - '.github/workflows/recomp-windows.yml'
  workflow_dispatch:

jobs:
  m7-rom-flag-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan ROM event flag A6/A7 references
        run: python recomp/tools/scan_event_flags.py --banks-dir src/banks --flags 0x02 0x03 0x04 0x0C 0x10 0x21 0x22 0x23 0x24 0x25 0x26 0x12A 0x185 0x186 0x187 0x188 0x189 0x18A 0x18B 0x18C 0xA0 0xA1 0xA2 0xA3 0xA4 0xA5 0xA6 0xA7 --pointers 0x56CD 0x56F3 0x433C 0x4343 0x4360 0x5ECB 0x50F2 0x510D 0x5ABF 0x5C10
      - name: Scan C916 selector references
        run: python recomp/tools/scan_c916.py --banks-dir src/banks

      - name: Scan C923 event-state references
        run: python recomp/tools/scan_c923.py --banks-dir src/banks
      - name: Scan C5DB/C5DC gameplay mode references
        run: python recomp/tools/scan_game_modes.py --banks-dir src/banks
      - name: Trace banked callers of battle-mode writers
        run: python recomp/tools/scan_battle_callers.py --banks-dir src/banks

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Restore native recomp build cache
        uses: actions/cache/restore@v4
        with:
          path: recomp/build
          key: m7-native-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            m7-native-${{ runner.os }}-
            m6-native-${{ runner.os }}-

      - name: Validate complete LR35902 frontend
        run: python recomp/tools/test_lr35902.py --bank0 src/banks/bank_000.asm

      - name: Audit complete Bank 0 static translation
        run: python recomp/tools/recompile_bank0.py --bank src/banks/bank_000.asm --audit-only

      - name: Configure native recomp
        run: cmake -S recomp -B recomp/build -A x64

      - name: Build native recomp and required AOT dependencies
        shell: pwsh
        run: |
          $cmakeText = Get-Content recomp/CMakeLists.txt -Raw
          $match = [regex]::Match($cmakeText, 'set\(NATIVE_ROMX_BANKS\s+([^)]+)\)')
          if (-not $match.Success) { throw 'Could not parse NATIVE_ROMX_BANKS' }
          $banks = $match.Groups[1].Value -split '\s+' | Where-Object { $_ -match '^\d{1,3}$' }

          $missing = @()
          if (-not (Test-Path 'recomp/build/Release/dwm2t_bank0.lib')) {
            $missing += 'dwm2t_bank0'
          }
          if (-not (Test-Path 'recomp/build/Release/dwm2t_rom_image.lib')) {
            $missing += 'dwm2t_rom_image'
          }
          foreach ($bank in $banks) {
            if (-not (Test-Path "recomp/build/Release/dwm2t_romx_bank_$bank.lib")) {
              $missing += "dwm2t_romx_bank_$bank"
            }
          }

          if ($missing.Count -gt 4) {
            Write-Host "Cold/incomplete cache: building full dependency graph ($($missing.Count) libraries missing)."
            cmake --build recomp/build --config Release --target DWM2tRecomp --parallel 4
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            foreach ($target in $missing) {
              Write-Host "Building missing cached dependency: $target"
              cmake --build recomp/build --config Release --target $target --parallel 4
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }

            Write-Host 'Relinking executable from verified cached AOT libraries.'
            cmake --build recomp/build --config Release --target DWM2tRecomp --parallel 4 -- /p:BuildProjectReferences=false
            if ($LASTEXITCODE -ne 0) {
              Write-Host 'Fast relink failed; falling back to the full dependency graph.'
              cmake --build recomp/build --config Release --target DWM2tRecomp --parallel 4
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      - name: Save native recomp build cache
        uses: actions/cache/save@v4
        with:
          path: recomp/build
          key: m7-native-${{ runner.os }}-${{ github.sha }}

      # Keep hosted validation identical to the offline Windows runner.
      # Legacy bounded discovery searches are not milestone acceptance gates.
      - name: Run all local-equivalent M1-M7 acceptance gates
        run: ctest --test-dir recomp/build -C Release --parallel 4 --output-on-failure --stop-on-failure

      - name: Upload Windows executable and milestone images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DWM2tRecomp-M7-Windows-x64
          path: |
            recomp/build/Release/DWM2tRecomp.exe
            recomp/build/local-validation/**
            recomp/build/Testing/Temporary/LastTest.log
          if-no-files-found: error
